{% extends "base.html" %}

{% block title %}Nueva contraseña · NEXUS Talent IA{% endblock %}

{% block content %}
<section class="acceso">
  <h1>Nueva contraseña</h1>
  {% if validlink %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar contraseña</button>
  </form>
  {% else %}
  <p class="ayuda">Este enlace ya no es valido. Solicita uno nuevo.</p>
  <p class="enlace"><a href="{% url 'password_reset' %}">Recuperar de nuevo</a></p>
  {% endif %}
</section>
{% endblock %}
